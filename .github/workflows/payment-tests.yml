name: HappyPrancer Payment Tests

on:
  workflow_dispatch:
    inputs:
      institution:
        description: Institution to test
        required: true
        type: choice
        options:
          - happyprancer
        default: happyprancer

      module:
        description: Testing module
        required: true
        type: choice
        options:
          - payment
        default: payment

      project:
        description: Playwright project
        required: false
        type: choice
        options:
          - Payment Desktop Chrome
        default: Payment Desktop Chrome

      dashboard_url:
        description: Optional dashboard URL to include in the summary
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: payment-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Diagnose GitHub runner network
        env:
          HAPPYPRANCER_BASE_URL: ${{ secrets.HAPPYPRANCER_BASE_URL }}
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner name: $RUNNER_NAME"
          echo "Public IPv4:"
          curl -4 -s https://api.ipify.org
          echo
          echo "HappyPrancer URL:"
          echo "$HAPPYPRANCER_BASE_URL"
          echo "HappyPrancer response:"
          curl -I -L --max-time 20 "$HAPPYPRANCER_BASE_URL"
      - name: Run HappyPrancer payment tests
        env:
          HAPPYPRANCER_BASE_URL: ${{ secrets.HAPPYPRANCER_BASE_URL }}
          HAPPYPRANCER_LOGIN_EMAIL: ${{ secrets.HAPPYPRANCER_LOGIN_EMAIL }}
          HAPPYPRANCER_LOGIN_PASSWORD: ${{ secrets.HAPPYPRANCER_LOGIN_PASSWORD }}
          HAPPYPRANCER_PAYMENT_PHONE: ${{ secrets.HAPPYPRANCER_PAYMENT_PHONE }}
          HAPPYPRANCER_PAYMENT_EMAIL: ${{ secrets.HAPPYPRANCER_PAYMENT_EMAIL }}

        run: |
          xvfb-run -a node node_modules/@playwright/test/cli.js test tests/payment.spec.ts \
            --config=playwright.payment.config.ts \
            --project="Payment Desktop Chrome" \
            --workers=1

      - name: Generate Excel payment report
        if: always()
        run: |
          node generate-payment-excel-report.js

      - name: Prepare payment dashboard result
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const resultPath = path.join(
            'test-results',
            'payment-results.json'
          );

          const htmlDir = path.join(
            'reports',
            'payment-html'
          );

          const excelDir = path.join(
            'reports',
            'excel'
          );

          fs.mkdirSync(htmlDir, { recursive: true });

          let summary = null;

          if (fs.existsSync(resultPath)) {
            try {
              const data = JSON.parse(
                fs.readFileSync(resultPath, 'utf8')
              );

              const stats = data.stats || {};

              summary = {
                passed: Number(stats.expected || 0),
                failed: Number(stats.unexpected || 0),
                skipped: Number(stats.skipped || 0),
                flaky: Number(stats.flaky || 0)
              };
            } catch (error) {
              console.error(
                'Could not read payment-results.json:',
                error.message
              );
            }
          }

          let excelReport = null;

          if (fs.existsSync(excelDir)) {
            const files = fs
              .readdirSync(excelDir)
              .filter(name =>
                name.toLowerCase().endsWith('.xlsx')
              );

            if (files.length) {
              excelReport = files[files.length - 1];
            }
          }

          fs.writeFileSync(
            path.join(
              htmlDir,
              'payment-test-result.json'
            ),
            JSON.stringify(
              {
                summary,
                excelReport,
                generatedAt: new Date().toISOString()
              },
              null,
              2
            )
          );
          NODE

      - name: Upload payment HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyprancer-payment-html-report
          path: reports/payment-html
          if-no-files-found: ignore

      - name: Upload payment Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyprancer-payment-excel-report
          path: reports/excel
          if-no-files-found: ignore

      - name: Setup Pages
        if: always()
        id: pages-setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Prepare combined Pages artifact
        if: always()
        id: prepare-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          rm -rf reports/pages
          rm -rf /tmp/auth-pages
          mkdir -p reports/pages
          mkdir -p /tmp/auth-pages

          echo "Finding the latest completed authentication workflow..."

          RUNS_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/auth-tests.yml/runs?branch=${REF_NAME}&status=completed&per_page=20")

          RUN_IDS=$(printf '%s' "${RUNS_JSON}" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);

              for (const run of data.workflow_runs || []) {
                if (run.status === "completed") {
                  console.log(run.id);
                }
              }
            });
          ')

          AUTH_ARTIFACT_ID=""

          for RUN_ID in ${RUN_IDS}; do
            echo "Checking authentication run: ${RUN_ID}"

            ARTIFACTS_JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")

            ARTIFACT_ID=$(printf '%s' "${ARTIFACTS_JSON}" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(input);

                const artifact = (data.artifacts || []).find(
                  item =>
                    item.name === "playwright-html-report" &&
                    item.expired === false
                );

                if (artifact) {
                  console.log(artifact.id);
                }
              });
            ')

            if [ -n "${ARTIFACT_ID}" ]; then
              AUTH_ARTIFACT_ID="${ARTIFACT_ID}"
              echo "Authentication artifact found: ${AUTH_ARTIFACT_ID}"
              break
            fi
          done

          if [ -z "${AUTH_ARTIFACT_ID}" ]; then
            echo "ERROR: Could not find a usable authentication HTML report artifact."
            echo "The payment Pages deployment will not continue."
            exit 1
          fi

          echo "Downloading authentication report artifact..."

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${AUTH_ARTIFACT_ID}/zip" \
            -o /tmp/auth-pages.zip

          unzip -q /tmp/auth-pages.zip -d /tmp/auth-pages

          echo "Restoring authentication report..."

          cp -R /tmp/auth-pages/. reports/pages/

          echo "Adding payment report..."

          mkdir -p reports/pages/payment

          if [ -d "reports/payment-html" ]; then
            cp -R reports/payment-html/. reports/pages/payment/
          fi

          if [ -d "reports/excel" ]; then
            mkdir -p reports/pages/payment/excel
            cp -R reports/excel/. reports/pages/payment/excel/
          fi

          echo ""
          echo "Combined Pages structure:"
          find reports/pages -maxdepth 3 -type f | sort

      - name: Upload Pages artifact
        if: always() && steps.prepare-pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/pages

      - name: Deploy payment report to GitHub Pages
        if: always() && steps.prepare-pages.outcome == 'success'
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Write job summary
        if: always()
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          echo "## HappyPrancer Payment Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`Payment Desktop Chrome\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module: \`Payment\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Institution: \`HappyPrancer\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTML report: ${PAGE_URL}payment/" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DASHBOARD_URL" ]; then
            echo "- Dashboard: ${DASHBOARD_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi