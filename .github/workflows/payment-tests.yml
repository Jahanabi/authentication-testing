name: HappyPrancer Payment Tests

on:
  workflow_dispatch:
    inputs:
      institution:
        description: Institution to test
        required: true
        type: choice
        options:
          - happyprancer
        default: happyprancer

      module:
        description: Testing module
        required: true
        type: choice
        options:
          - payment
        default: payment

      project:
        description: Playwright project
        required: false
        type: choice
        options:
          - Payment Desktop Chrome
        default: Payment Desktop Chrome

      dashboard_url:
        description: Optional dashboard URL to include in the summary
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: payment-tests
  cancel-in-progress: true

jobs:
  test:
    # Your Windows PC, using your Indian internet connection
    runs-on: [self-hosted, Windows, X64, happyprancer-india]

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Install Playwright browsers
        shell: powershell
        run: npx playwright install chromium

      - name: Check HappyPrancer location
        shell: powershell
        run: |
          Write-Host "Checking HappyPrancer location..."

          $response = Invoke-RestMethod `
            "https://ikticbkaxh.execute-api.us-east-2.amazonaws.com/dev/user/check-user-location"

          Write-Host "Location response:"
          $response | ConvertTo-Json

      - name: Diagnose runner network
        shell: powershell
        env:
          HAPPYPRANCER_BASE_URL: ${{ secrets.HAPPYPRANCER_BASE_URL }}
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner name: $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Public IPv4:"
          curl.exe -s https://api.ipify.org
          Write-Host ""

          Write-Host ""
          Write-Host "HappyPrancer URL:"
          Write-Host $env:HAPPYPRANCER_BASE_URL

          Write-Host ""
          Write-Host "HappyPrancer HTTP status:"
          curl.exe -sS -L `
            -o NUL `
            -w "HTTP status: %{http_code}`n" `
            "$env:HAPPYPRANCER_BASE_URL"

      - name: Run HappyPrancer payment tests
        shell: powershell
        env:
          HAPPYPRANCER_BASE_URL: ${{ secrets.HAPPYPRANCER_BASE_URL }}
          HAPPYPRANCER_LOGIN_EMAIL: ${{ secrets.HAPPYPRANCER_LOGIN_EMAIL }}
          HAPPYPRANCER_LOGIN_PASSWORD: ${{ secrets.HAPPYPRANCER_LOGIN_PASSWORD }}
          HAPPYPRANCER_PAYMENT_PHONE: ${{ secrets.HAPPYPRANCER_PAYMENT_PHONE }}
          HAPPYPRANCER_PAYMENT_EMAIL: ${{ secrets.HAPPYPRANCER_PAYMENT_EMAIL }}

        run: |
          node node_modules/@playwright/test/cli.js test tests/payment.spec.ts `
            --config=playwright.payment.config.ts `
            --project="Payment Desktop Chrome" `
            --workers=1 `
            -g "PAYMENT-012"

      - name: Generate Excel payment report
        if: always()
        shell: powershell
        run: |
          node generate-payment-excel-report.js

      - name: Prepare payment dashboard result
        if: always()
        shell: powershell
        run: |
          $resultPath = Join-Path "test-results" "payment-results.json"
          $htmlDir = Join-Path "reports" "payment-html"
          $excelDir = Join-Path "reports" "excel"

          New-Item -ItemType Directory -Force -Path $htmlDir | Out-Null

          $summary = $null

          if (Test-Path $resultPath) {
            try {
              $data = Get-Content $resultPath -Raw | ConvertFrom-Json
              $stats = $data.stats

              $summary = @{
                passed = [int]($stats.expected)
                failed = [int]($stats.unexpected)
                skipped = [int]($stats.skipped)
                flaky = [int]($stats.flaky)
              }
            }
            catch {
              Write-Host "Could not read payment-results.json:"
              Write-Host $_.Exception.Message
            }
          }

          $excelReport = $null

          if (Test-Path $excelDir) {
            $excelFiles = Get-ChildItem $excelDir -File |
              Where-Object { $_.Extension -ieq ".xlsx" } |
              Sort-Object LastWriteTime

            if ($excelFiles.Count -gt 0) {
              $excelReport = $excelFiles[-1].Name
            }
          }

          $result = @{
            summary = $summary
            excelReport = $excelReport
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $result |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              (Join-Path $htmlDir "payment-test-result.json")

      - name: Upload payment HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyprancer-payment-html-report
          path: reports/payment-html
          if-no-files-found: ignore

      - name: Upload payment Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyprancer-payment-excel-report
          path: reports/excel
          if-no-files-found: ignore

      - name: Setup Pages
        if: always()
        id: pages-setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Prepare combined Pages artifact
        if: always()
        id: prepare-pages
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}

        run: |
          $ErrorActionPreference = "Stop"

          $pagesDir = Join-Path $PWD "reports/pages"
          $authDir = Join-Path $PWD "auth-pages-temp"
          $authZip = Join-Path $PWD "auth-pages.zip"

          if (Test-Path $pagesDir) {
            Remove-Item $pagesDir -Recurse -Force
          }

          if (Test-Path $authDir) {
            Remove-Item $authDir -Recurse -Force
          }

          if (Test-Path $authZip) {
            Remove-Item $authZip -Force
          }

          New-Item -ItemType Directory -Force -Path $pagesDir | Out-Null
          New-Item -ItemType Directory -Force -Path $authDir | Out-Null

          Write-Host "Finding the latest completed authentication workflow..."

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }

          $runsUrl = "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/auth-tests.yml/runs?branch=$env:REF_NAME&status=completed&per_page=20"

          $runsResponse = Invoke-RestMethod `
            -Uri $runsUrl `
            -Headers $headers `
            -Method Get

          $authArtifactId = $null

          foreach ($run in $runsResponse.workflow_runs) {

            Write-Host "Checking authentication run: $($run.id)"

            $artifactsUrl = "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100"

            $artifactsResponse = Invoke-RestMethod `
              -Uri $artifactsUrl `
              -Headers $headers `
              -Method Get

            $artifact = $artifactsResponse.artifacts |
              Where-Object {
                $_.name -eq "playwright-html-report" -and
                $_.expired -eq $false
              } |
              Select-Object -First 1

            if ($artifact) {
              $authArtifactId = $artifact.id

              Write-Host "Authentication artifact found: $authArtifactId"

              break
            }
          }

          if (-not $authArtifactId) {
            Write-Host "ERROR: Could not find a usable authentication HTML report artifact."
            Write-Host "The payment Pages deployment will not continue."
            exit 1
          }

          Write-Host "Downloading authentication report artifact..."

          $artifactUrl = "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$authArtifactId/zip"

          Invoke-WebRequest `
            -Uri $artifactUrl `
            -Headers $headers `
            -OutFile $authZip

          Write-Host "Extracting authentication report..."

          Expand-Archive `
            -Path $authZip `
            -DestinationPath $authDir `
            -Force

          Write-Host "Restoring authentication report..."

          Copy-Item `
            -Path (Join-Path $authDir "*") `
            -Destination $pagesDir `
            -Recurse `
            -Force

          Write-Host "Adding payment report..."

          $paymentDir = Join-Path $pagesDir "payment"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $paymentDir | Out-Null

          $paymentHtmlDir = Join-Path $PWD "reports/payment-html"

          if (Test-Path $paymentHtmlDir) {
            Copy-Item `
              -Path (Join-Path $paymentHtmlDir "*") `
              -Destination $paymentDir `
              -Recurse `
              -Force
          }

          $paymentExcelDir = Join-Path $PWD "reports/excel"

          if (Test-Path $paymentExcelDir) {

            $paymentExcelPagesDir = Join-Path $paymentDir "excel"

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $paymentExcelPagesDir | Out-Null

            Copy-Item `
              -Path (Join-Path $paymentExcelDir "*") `
              -Destination $paymentExcelPagesDir `
              -Recurse `
              -Force
          }

          Write-Host ""
          Write-Host "Combined Pages structure:"

          Get-ChildItem `
            -Path $pagesDir `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }
      - name: Use GNU tar for GitHub Pages
        if: always() && steps.prepare-pages.outcome == 'success'
        shell: powershell
        run: |
          $gitBin = "C:\Program Files\Git\usr\bin"

          if (-not (Test-Path "$gitBin\tar.exe")) {
            Write-Host "ERROR: GNU tar was not found at $gitBin\tar.exe"
            exit 1
          }

          Write-Host "Using GNU tar:"
          & "$gitBin\tar.exe" --version

          Add-Content $env:GITHUB_PATH $gitBin
          Write-Host "Added Git usr bin to PATH for subsequent steps."
      
      - name: Upload Pages artifact
        if: always() && steps.prepare-pages.outcome == 'success'
        id: upload-pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: reports/pages
          
      - name: Deploy payment report to GitHub Pages
        if: always() && steps.prepare-pages.outcome == 'success' && steps.upload-pages.outcome == 'success'
        id: pages
        uses: actions/deploy-pages@v4

      - name: Write job summary
        if: always()
        shell: powershell
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "## HappyPrancer Payment Test Report"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value ""

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "- Project: ``Payment Desktop Chrome``"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "- Module: ``Payment``"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "- Institution: ``HappyPrancer``"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "- HTML report: $env:PAGE_URL`payment/"

          if ($env:DASHBOARD_URL) {
            Add-Content `
              -Path $env:GITHUB_STEP_SUMMARY `
              -Value "- Dashboard: $env:DASHBOARD_URL"
          }